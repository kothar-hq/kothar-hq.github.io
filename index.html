<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kothar — coming soon</title>
<meta name="description" content="Kothar: Windows container work by Justin Dearing. Coming soon.">
<style>
  :root { --bg: #f6f3ee; --fg: #1d2530; --muted: #5d6875; --wall: #d9d2c5; --pane: #2f6fb7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161c; --fg: #eef1f4; --muted: #9aa5b1; --wall: #2a313b; --pane: #5aa2e6; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; padding: 16px; text-align: center;
  }
  svg { width: 120px; height: 120px; }
  h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 600; letter-spacing: 0.04em; margin: 24px 0 8px; }
  p { margin: 0; font-size: 1.25rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <!-- A window set in a wall: four panes. -->
  <svg viewBox="0 0 120 120" role="img" aria-label="A four-pane window set in a wall">
    <rect width="120" height="120" rx="6" fill="var(--wall)"/>
    <rect x="30" y="30" width="28" height="28" fill="var(--pane)"/>
    <rect x="62" y="30" width="28" height="28" fill="var(--pane)"/>
    <rect x="30" y="62" width="28" height="28" fill="var(--pane)"/>
    <rect x="62" y="62" width="28" height="28" fill="var(--pane)"/>
  </svg>
  <h1>Kothar</h1>
  <p>Coming soon.</p>
</main>
</body>
</html>
